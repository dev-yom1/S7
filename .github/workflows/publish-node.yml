name: Publish Node package to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "node/package.json"
    tags:
      - "node-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global "npm@^11.5.1"

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Validate Node CLI
        run: |
          npm run check
          npm test
          node ./bin/s7.js --version

      - name: Verify package and CLI versions match
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          cli_version="$(node --input-type=module -e "import('./src/cli.js').then(m => process.stdout.write(m.VERSION))")"
          if [[ "${package_version}" != "${cli_version}" ]]; then
            echo "package.json version ${package_version} does not match CLI version ${cli_version}." >&2
            exit 1
          fi

      - name: Verify Node release tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="node-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}; expected ${expected}." >&2
            exit 1
          fi

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish to npm with OIDC
        run: npm publish --access public
