name: Apply hardening and updater

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-hardening-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed patch
        run: python .github/scripts/apply_hardening_update.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q src
      - name: Commit changes and remove temporary updater files
        run: |
          rm -f .github/scripts/apply_hardening_update.py
          rm -f .github/workflows/apply-hardening-update.yml
          git config user.name "S7 Development"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden transport and add self-update command"
          git push origin HEAD:develop
